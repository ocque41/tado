name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust format
        run: cd tado-core && cargo fmt --all --check

      - name: Rust terminal tests
        run: cd tado-core && cargo test -p tado-runtime -p tado-cli -p tado-mcp

      - name: Swift build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: npm pack dry run
        run: cd npm/tado && npm pack --dry-run --json

      - name: Check binary modes
        run: |
          bad="$(find npm/tado/prebuilt/darwin-* -type f ! -perm -111 -print)"
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

      - name: npm tarball smoke
        run: |
          set -euo pipefail
          cd npm/tado
          tarball="$(npm pack --json | node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(0,"utf8")); console.log(p[0].filename)')"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" -g "./$tarball"
          "$prefix/bin/tado" --help
          "$prefix/bin/tadod" --help
          mcp_out="$(mktemp)"
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | "$prefix/bin/tado-mcp" > "$mcp_out"
          node - "$mcp_out" <<'NODE'
          const fs = require("fs");
          const lines = fs.readFileSync(process.argv[2], "utf8").trim().split(/\n+/).map(JSON.parse);
          if (lines.length !== 2) throw new Error(`expected 2 MCP responses, got ${lines.length}`);
          if (lines[0].result?.serverInfo?.name !== "tado") throw new Error("bad MCP initialize response");
          if (!Array.isArray(lines[1].result?.tools) || lines[1].result.tools.length === 0) {
            throw new Error("bad MCP tools/list response");
          }
          NODE
          storage="$(mktemp -d)"
          TADO_STORAGE_ROOT="$storage" "$prefix/bin/tado" --profile ci daemon start
          TADO_STORAGE_ROOT="$storage" "$prefix/bin/tado" --profile ci daemon status
          TADO_STORAGE_ROOT="$storage" "$prefix/bin/tado" --profile ci daemon stop
