#
# tado-cli — coordinator-driven Tado CLIs.
#
# Fourteen binaries, one shared library:
#
#   tado-projects   — list / resolve project names → root paths
#   tado-eternal    — propose/status/crafted/accept/reject/list/stop
#                     across the Eternal lifecycle
#   tado-dispatch   — same surface against Dispatch
#   tado-bootstrap  — drive the four bootstrap actions per project
#   tado-system     — app + vault status snapshot
#   tado-kanban     — read / mutate the per-project Kanban board
#   tado-cowork     — fire `claude://cowork/new?q=…&folder=…` so
#                     `ProcessSpawner` can launch a Cowork session
#                     against the bundled Tado-Cowork plugin
#   tado-deploy     — enqueue visible canvas agent spawn requests
#   tado            — unified CLI-first Agent OS entrypoint
#   tado-list      — runtime-backed session list for CLI profiles
#   tado-read      — runtime-backed transcript/screen read for CLI profiles
#   tado-send      — runtime-backed PTY input for CLI profiles
#   tado-events    — runtime-backed event list/follow for CLI profiles
#   tado-tui        — terminal UI for active Tado runtime work
#
# Coordinator operations preserve the desktop-app control socket path by
# default. When `TADO_PROFILE`, `TADO_RUNTIME_SOCKET`, or `TADO_RUNTIME_ID`
# selects a CLI runtime profile, A2A aliases, Kanban, bootstrap, Dispatch,
# and Eternal route through `tado-runtime` / `tadod` instead, so CLI profiles
# can own PTYs, transcripts, events, and workflow state without the desktop app.
#
# Wire format: length-prefixed JSON. 4-byte big-endian unsigned
# length, then exactly that many UTF-8 bytes of JSON. The Swift
# `ControlSocketServer` and the Rust `control_client` here MUST
# stay byte-compatible.
#

[package]
name = "tado-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Coordinator-driven Tado CLIs (projects/eternal/dispatch/bootstrap/system)."

[lib]
name = "tado_cli"
path = "src/lib.rs"

[[bin]]
name = "tado-projects"
path = "src/bin/tado-projects.rs"

[[bin]]
name = "tado-eternal"
path = "src/bin/tado-eternal.rs"

[[bin]]
name = "tado-dispatch"
path = "src/bin/tado-dispatch.rs"

[[bin]]
name = "tado-bootstrap"
path = "src/bin/tado-bootstrap.rs"

[[bin]]
name = "tado-system"
path = "src/bin/tado-system.rs"

[[bin]]
name = "tado-kanban"
path = "src/bin/tado-kanban.rs"

[[bin]]
name = "tado-cowork"
path = "src/bin/tado-cowork.rs"

[[bin]]
name = "tado-deploy"
path = "src/bin/tado-deploy.rs"

[[bin]]
name = "tado-tui"
path = "src/bin/tado-tui.rs"

[[bin]]
name = "tado"
path = "src/bin/tado.rs"

[[bin]]
name = "tado-list"
path = "src/bin/tado-list.rs"

[[bin]]
name = "tado-read"
path = "src/bin/tado-read.rs"

[[bin]]
name = "tado-send"
path = "src/bin/tado-send.rs"

[[bin]]
name = "tado-events"
path = "src/bin/tado-events.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tado-runtime = { path = "../tado-runtime" }
tado-settings = { path = "../tado-settings" }
